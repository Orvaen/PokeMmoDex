<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />

    <meta name="description" content="Pokédex PokeMMO gratuit et open source : les 649 Pokémon des générations 1 à 5 avec les stats du jeu, les lieux de capture et hordes, les faiblesses, et un planificateur d'élevage pour réussir tes 5×31 et 6×31." />
    <meta name="keywords" content="PokeMMO, Pokédex, PokeMMO Dex, élevage PokeMMO, breeding PokeMMO, IV 31, 6x31, 5x31, nature, hordes, lieux de capture, Pokémon, Kanto, Johto, Hoenn, Sinnoh, Unys" />
    <meta name="author" content="rayan-studio" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#f6f8f5" media="(prefers-color-scheme: light)" />

    <!-- Applique le thème et la langue enregistrés avant le premier affichage, pour éviter un flash du mauvais thème -->
    <script>
      try {
        var th = JSON.parse(localStorage.getItem("pmdex:theme"));
        if (th === "light" || th === "dark") document.documentElement.dataset.theme = th;
        var lg = JSON.parse(localStorage.getItem("pmdex:lang"));
        if (lg === "fr" || lg === "en") document.documentElement.lang = lg;
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://play.pokemonshowdown.com" />
    <link rel="dns-prefetch" href="https://raw.githubusercontent.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@300;400;500&display=swap" />

        "@context": "https://schema.org",
